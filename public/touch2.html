<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>DMX Touch</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   RESET & ROOT
   ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--surface:rgba(255,255,255,.06);--surface2:rgba(255,255,255,.03);
  --border:rgba(255,255,255,.08);--text:#fff;--dim:rgba(255,255,255,.35);
  --active:#fff;--danger:#ff3b30;--green:#30d158;--blue:#0a84ff;
  --orange:#ff9f0a;--safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --tab-h:56px;--toolbar-h:68px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
  touch-action:manipulation;display:flex;flex-direction:column;
  padding-top:var(--safe-t);
}

/* ═══════════════════════════════════════════════════════════════
   TOP TOOLBAR
   ═══════════════════════════════════════════════════════════════ */
.toolbar{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;flex-shrink:0;z-index:100;
  background:var(--bg);
}
.toolbar-pill{
  display:flex;align-items:center;justify-content:center;gap:6px;
  height:44px;padding:0 20px;border-radius:22px;border:none;
  font-size:14px;font-weight:600;letter-spacing:.02em;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .1s,opacity .15s;position:relative;overflow:hidden;
}
.toolbar-pill:active{transform:scale(.92)}
.toolbar-pill::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:currentColor;opacity:0;transition:opacity .1s;
}
.toolbar-pill:active::before{opacity:.12}

#btnOutput{background:var(--green);color:#000}
#btnOutput.off{background:rgba(255,255,255,.1);color:var(--dim)}
#btnBlackout{background:var(--danger);color:#fff}
#btnBlackout.active{animation:blackout-pulse .4s ease-in-out infinite alternate}
@keyframes blackout-pulse{from{opacity:1}to{opacity:.5}}

.toolbar-spacer{flex:1}
.status-pip{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-pip.ok{background:var(--green)}
.status-pip.err{background:var(--danger)}

/* Mode toggle (segmented control) */
.seg-ctrl{
  display:flex;background:rgba(255,255,255,.08);border-radius:20px;padding:3px;
}
.seg-ctrl button{
  padding:7px 14px;border-radius:17px;border:none;background:none;
  font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:all .2s;
}
.seg-ctrl button.active{background:var(--active);color:#000}

/* ═══════════════════════════════════════════════════════════════
   TAB BAR (bottom iOS-style)
   ═══════════════════════════════════════════════════════════════ */
.tab-bar{
  display:flex;background:rgba(20,20,20,.95);
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);
  border-top:1px solid var(--border);flex-shrink:0;z-index:100;
  padding-bottom:var(--safe-b);
}
.tab-bar button{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:8px 0 6px;border:none;background:none;
  color:var(--dim);font-size:10px;font-weight:500;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:color .15s;
}
.tab-bar button .tab-icon{font-size:22px;line-height:1}
.tab-bar button.active{color:var(--active)}

/* ═══════════════════════════════════════════════════════════════
   PAGES
   ═══════════════════════════════════════════════════════════════ */
.pages{flex:1;position:relative;overflow:hidden}
.page{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  padding:10px 12px;display:none;
  -webkit-overflow-scrolling:touch;
}
.page.active{display:block}
/* Colors page: single-column dashboard, no scroll */
.page-dash{display:none !important;flex-direction:column;gap:8px;overflow:hidden !important;padding:8px 10px}
.page-dash.active{display:flex !important}

.page-title{
  font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:16px;
}
.section-label{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
  color:var(--dim);margin:0 0 4px;
}

/* ═══════════════════════════════════════════════════════════════
   COLOR GRID (square tiles)
   ═══════════════════════════════════════════════════════════════ */
.color-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;flex:1;min-height:0;
  align-content:start;
}
.color-tile{
  border-radius:10px;border:2.5px solid transparent;min-height:48px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:border-color .12s,transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.color-tile:active{transform:scale(.92)}
.color-tile.active{border-color:var(--active);box-shadow:0 0 0 2px var(--active)}
.color-tile .color-label{
  position:absolute;bottom:0;left:0;right:0;padding:2px 0;
  text-align:center;font-size:9px;font-weight:700;
  background:linear-gradient(transparent,rgba(0,0,0,.65));
  color:#fff;letter-spacing:.03em;
}

/* Effect tile */
.color-tile.effect-tile{
  display:flex;align-items:center;justify-content:center;
  min-height:56px;cursor:pointer;
}
.color-tile.effect-tile.active{border-color:#fff !important;box-shadow:0 0 0 2px #fff}

/* ═══════════════════════════════════════════════════════════════
   iOS SLIDER (big, fat, round)
   ═══════════════════════════════════════════════════════════════ */
.slider-wrap{
  display:flex;align-items:center;gap:10px;padding:0;flex-shrink:0;
}
.slider-label{
  font-size:12px;font-weight:600;color:var(--dim);min-width:48px;
}
.slider-val{
  font-size:14px;font-weight:700;min-width:32px;text-align:center;
  font-variant-numeric:tabular-nums;
}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;
  height:36px;background:transparent;cursor:pointer;touch-action:none;
}
input[type=range]::-webkit-slider-runnable-track{
  height:28px;border-radius:14px;
  background:rgba(255,255,255,.08);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:28px;height:28px;border-radius:50%;
  background:#fff;border:none;margin-top:0;
  box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.1);
}
input[type=range]::-moz-range-track{
  height:28px;border-radius:14px;border:none;
  background:rgba(255,255,255,.08);
}
input[type=range]::-moz-range-thumb{
  width:28px;height:28px;border-radius:50%;
  background:#fff;border:none;
  box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.1);
}
/* Small variant for inline lists */
.slider-sm{flex:0 0 100px !important;height:32px !important}
.slider-sm::-webkit-slider-runnable-track{height:22px;border-radius:11px}
.slider-sm::-webkit-slider-thumb{width:22px;height:22px}
.slider-sm::-moz-range-track{height:22px;border-radius:11px}
.slider-sm::-moz-range-thumb{width:22px;height:22px}
/* Side-by-side slider row */
.slider-pair{display:flex;gap:14px;flex-shrink:0;padding:4px 0}
.slider-pair .slider-wrap{flex:1;min-width:0}

/* ═══════════════════════════════════════════════════════════════
   CHIPS (group selectors)
   ═══════════════════════════════════════════════════════════════ */
.chip-row{display:flex;flex-wrap:wrap;gap:6px;flex-shrink:0}
.chip{
  height:32px;padding:0 14px;border-radius:16px;
  border:1.5px solid var(--border);background:var(--surface);
  font-size:12px;font-weight:600;color:var(--dim);
  display:inline-flex;align-items:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:all .15s;
}
.chip:active{transform:scale(.94)}
.chip.active{border-color:var(--active);color:var(--active);background:rgba(255,255,255,.1)}

/* ═══════════════════════════════════════════════════════════════
   LIST ROWS (fixtures, groups, movers)
   ═══════════════════════════════════════════════════════════════ */
.list-card{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-radius:16px;
  background:var(--surface);margin-bottom:8px;
}
.list-card .lc-name{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-card .lc-sub{font-size:12px;color:var(--dim)}
.list-card .lc-val{font-size:14px;font-weight:700;min-width:30px;text-align:center;font-variant-numeric:tabular-nums}

/* iOS toggle */
.ios-toggle{
  width:51px;height:31px;border-radius:16px;flex-shrink:0;
  background:rgba(255,255,255,.15);position:relative;cursor:pointer;
  transition:background .25s;-webkit-tap-highlight-color:transparent;
}
.ios-toggle.on{background:var(--green)}
.ios-toggle::after{
  content:'';position:absolute;width:27px;height:27px;border-radius:50%;
  background:#fff;top:2px;left:2px;transition:transform .25s;
  box-shadow:0 2px 4px rgba(0,0,0,.2);
}
.ios-toggle.on::after{transform:translateX(20px)}

/* ═══════════════════════════════════════════════════════════════
   ACTION GRID
   ═══════════════════════════════════════════════════════════════ */
.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;flex-shrink:0}
.action-card{
  padding:12px 8px;border-radius:12px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .1s,background .15s;border:1.5px solid var(--border);
  min-height:56px;
}
.action-card:active{transform:scale(.94)}
.action-card.active{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.action-card .ac-icon{font-size:20px;line-height:1;margin-bottom:3px}
.action-card .ac-label{font-size:11px;font-weight:700}

/* Action tiles (in color grid) */
.color-tile.action-tile{
  background:var(--surface);border-color:var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.color-tile.action-tile:active{transform:scale(.92)}
.color-tile.action-tile.active{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.color-tile.action-tile .tile-icon{font-size:20px;line-height:1}
.color-tile.action-tile .color-label{position:static;background:none;font-size:10px;font-weight:700;padding:0}

/* Mover preset tiles (in color grid) */
.color-tile.mover-tile{
  background:var(--surface);border-color:var(--border);
  display:flex;align-items:center;justify-content:center;
}
.color-tile.mover-tile .color-label{position:static;background:none;font-size:10px;font-weight:700;padding:0}

/* ═══════════════════════════════════════════════════════════════
   SCENES
   ═══════════════════════════════════════════════════════════════ */
.scene-card{
  padding:14px 16px;border-radius:16px;
  background:var(--surface);margin-bottom:8px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .1s,border-color .15s;
  border:1.5px solid var(--border);position:relative;
}
.scene-card:active{transform:scale(.97)}
.scene-card.active-scene{border-color:var(--green);background:rgba(48,209,88,.08)}
.scene-card .sc-name{font-size:15px;font-weight:600;margin-bottom:2px}
.scene-card .sc-desc{font-size:12px;color:var(--dim);margin-bottom:6px}
.scene-card .sc-entries{display:flex;gap:4px;flex-wrap:wrap}
.scene-entry-dot{
  width:20px;height:20px;border-radius:50%;
  border:1px solid rgba(255,255,255,.15);
}
.scene-active-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:600;color:var(--green);
  padding:6px 14px;border-radius:16px;
  background:rgba(48,209,88,.1);margin-bottom:8px;
}
.scene-active-badge .badge-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.scene-deactivate-btn{
  height:36px;padding:0 16px;border-radius:18px;border:1.5px solid var(--danger);
  background:rgba(255,59,48,.1);color:var(--danger);font-size:13px;font-weight:600;
  cursor:pointer;-webkit-tap-highlight-color:transparent;margin-bottom:8px;
}
.scene-deactivate-btn:active{transform:scale(.94)}
.scene-empty{color:var(--dim);font-size:13px;text-align:center;padding:40px 0}

/* ═══════════════════════════════════════════════════════════════
   ACTIONS TAB (full-screen grid)
   ═══════════════════════════════════════════════════════════════ */
.page-actions{display:none !important;padding:0 !important;overflow:hidden !important;flex-direction:column}
.page-actions.active{display:flex !important}
.actions-grid{
  display:grid;
  grid-template-columns:repeat(var(--ag-cols,4),1fr);
  grid-auto-rows:minmax(72px,1fr);
  gap:4px;padding:4px;
  width:100%;flex:1;min-height:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.action-btn{
  border-radius:12px;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-weight:700;letter-spacing:.02em;position:relative;overflow:hidden;
  -webkit-tap-highlight-color:transparent;transition:transform .08s,opacity .12s;
  padding:6px 4px;
}
.action-btn:active{transform:scale(.92)}
.action-btn.held{opacity:.7;transform:scale(.94)}
.action-btn .ab-icon{font-size:22px;line-height:1}
.action-btn .ab-label{font-size:11px;line-height:1.2;text-align:center;word-break:break-word}
.action-btn.action-active{box-shadow:inset 0 0 0 2px #fff}

/* Mover presets on dashboard */
.mover-section{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.mover-section .section-label{margin:0}
.mover-grid{display:flex;flex-direction:column;gap:6px;flex:1;overflow-y:auto}
.mover-pill{
  padding:10px 14px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--surface);font-size:13px;font-weight:600;color:var(--text);
  cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:center;
  transition:all .12s;flex-shrink:0;min-height:44px;
  display:flex;align-items:center;justify-content:center;
}
.mover-pill:active{transform:scale(.94);background:rgba(255,255,255,.15)}

/* FX Bar (inline) */
.fx-row{
  display:flex;gap:8px;align-items:center;flex-shrink:0;padding:2px 0;
}
.fx-btn{
  height:36px;padding:0 16px;border-radius:18px;border:1.5px solid var(--border);
  background:var(--surface);font-size:13px;font-weight:700;color:var(--text);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  display:inline-flex;align-items:center;gap:5px;transition:all .12s;flex-shrink:0;
}
.fx-btn:active{transform:scale(.92)}
.fx-btn.active{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}
.fx-btn.strobe-on{animation:strobe-flash .1s infinite alternate}
@keyframes strobe-flash{from{opacity:1}to{opacity:.3}}

/* Preset list */
.preset-pill{
  height:44px;padding:0 20px;border-radius:22px;border:1.5px solid var(--border);
  background:var(--surface);font-size:14px;font-weight:600;color:var(--text);
  cursor:pointer;-webkit-tap-highlight-color:transparent;display:inline-flex;
  align-items:center;transition:all .12s;
}
.preset-pill:active{transform:scale(.92);background:rgba(255,255,255,.15)}

/* Clear btn (inline) */
.clear-btn-sm{
  height:32px;padding:0 14px;border-radius:16px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--dim);
  font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;transition:all .12s;
}
.clear-btn-sm:active{transform:scale(.94);background:rgba(255,255,255,.15)}
/* Inline group row */
.groups-row{
  display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;
}
.groups-row .section-label{margin:0;flex-shrink:0}

/* ═══════════════════════════════════════════════════════════════
   DECK INFO STRIP
   ═══════════════════════════════════════════════════════════════ */
.deck-strip{
  display:flex;gap:6px;padding:0 12px 6px;flex-shrink:0;
}
.deck-card{
  flex:1;display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);
  min-width:0;overflow:hidden;
}
.deck-num{
  font-size:11px;font-weight:800;color:var(--dim);
  flex-shrink:0;width:18px;text-align:center;
}
.deck-play-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,.15);transition:background .2s;
}
.deck-play-dot.playing{background:var(--green)}
.deck-play-dot.paused{background:var(--orange)}
.deck-info{
  flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;
}
.deck-track{
  font-size:12px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;color:var(--text);
}
.deck-track.empty{color:var(--dim);font-weight:400;font-style:italic}
.deck-meta{
  font-size:10px;font-weight:500;color:var(--dim);
  font-variant-numeric:tabular-nums;
}
/* ═══════════════════════════════════════════════════════════════
   PIN LOCK SCREEN
   ═══════════════════════════════════════════════════════════════ */
.pin-overlay{
  display:none;position:fixed;inset:0;z-index:10000;
  background:#000;flex-direction:column;align-items:center;justify-content:center;
  padding-top:var(--safe-t);padding-bottom:var(--safe-b);
}
.pin-overlay.active{display:flex}
.pin-title{font-size:28px;font-weight:700;margin-bottom:6px;letter-spacing:-.02em}
.pin-subtitle{font-size:13px;color:var(--dim);margin-bottom:28px}
.pin-dots{display:flex;gap:14px;margin-bottom:28px;height:20px;align-items:center}
.pin-dot{
  width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(255,255,255,.3);background:transparent;
  transition:background .1s,border-color .1s;
}
.pin-dot.filled{background:#fff;border-color:#fff}
.pin-dot.wrong{border-color:var(--danger);background:var(--danger);animation:pin-shake .4s}
@keyframes pin-shake{
  0%,100%{transform:translateX(0)}
  20%,60%{transform:translateX(-6px)}
  40%,80%{transform:translateX(6px)}
}
.pin-pad{
  display:grid;grid-template-columns:repeat(3,80px);gap:10px;
}
.pin-key{
  width:80px;height:80px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);color:#fff;font-size:28px;font-weight:500;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .1s,transform .08s;
  font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
.pin-key:active{background:rgba(255,255,255,.2);transform:scale(.92)}
.pin-key.empty{border-color:transparent;background:transparent;pointer-events:none}
.pin-key.fn{font-size:14px;font-weight:600;letter-spacing:.05em}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     PIN LOCK SCREEN
     ═══════════════════════════════════════════════════════════════ -->
<div class="pin-overlay" id="pinOverlay">
  <div class="pin-title">&#128274; DMX Touch</div>
  <div class="pin-subtitle">Enter PIN to unlock</div>
  <div class="pin-dots" id="pinDots"></div>
  <div class="pin-pad" id="pinPad">
    <button class="pin-key" data-digit="1">1</button>
    <button class="pin-key" data-digit="2">2</button>
    <button class="pin-key" data-digit="3">3</button>
    <button class="pin-key" data-digit="4">4</button>
    <button class="pin-key" data-digit="5">5</button>
    <button class="pin-key" data-digit="6">6</button>
    <button class="pin-key" data-digit="7">7</button>
    <button class="pin-key" data-digit="8">8</button>
    <button class="pin-key" data-digit="9">9</button>
    <div class="pin-key empty"></div>
    <button class="pin-key" data-digit="0">0</button>
    <button class="pin-key fn" id="pinBackspace">&#9003;</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     TOOLBAR
     ═══════════════════════════════════════════════════════════════ -->
<div class="toolbar">
  <span id="statusPip" class="status-pip err"></span>
  <div class="seg-ctrl" id="modeSwitch">
    <button class="active" data-mode="hold">HOLD</button>
    <button data-mode="toggle">TOGGLE</button>
  </div>
  <div class="toolbar-spacer"></div>
  <button class="toolbar-pill" id="btnOutput">OUTPUT</button>
  <button class="toolbar-pill" id="btnBlackout">BLACKOUT</button>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     DECK INFO
     ═══════════════════════════════════════════════════════════════ -->
<div class="deck-strip">
  <div class="deck-card">

<!-- ═══════════════════════════════════════════════════════════════
     JAVASCRIPT
     ═══════════════════════════════════════════════════════════════ -->
<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   PIN LOCK SYSTEM
   ═══════════════════════════════════════════════════════════════ */
let pinEnabled = false;
let pinLength = 4;  // will be determined from server config
let pinIdleTimeout = 0; // minutes
let pinEntry = '';
let pinLocked = true;
let idleTimer = null;

async function checkPinStatus() {
  try {
    const data = await fetch('/api/touch-pin/status').then(r => r.json());
    pinEnabled = data.enabled;
    pinIdleTimeout = data.idleTimeout || 0;
    pinLength = data.pinLength || 4;
    if (pinEnabled) {
      showPinScreen();
    } else {
      hidePinScreen();
    }
  } catch {
    // If we can't reach API, don't lock
    pinEnabled = false;
    hidePinScreen();
  }
}

function showPinScreen() {
  pinLocked = true;
  pinEntry = '';
  renderPinDots();
  document.getElementById('pinOverlay').classList.add('active');
  stopIdleTimer();
}

function hidePinScreen() {
  pinLocked = false;
  document.getElementById('pinOverlay').classList.remove('active');
  startIdleTimer();
}

function renderPinDots() {
  const container = document.getElementById('pinDots');
  container.innerHTML = '';
  for (let i = 0; i < pinLength; i++) {
    const dot = document.createElement('div');
    dot.className = 'pin-dot' + (i < pinEntry.length ? ' filled' : '');
    container.appendChild(dot);
  }
}

async function verifyPin() {
  try {
    const res = await fetch('/api/touch-pin/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: pinEntry }),
    });
    if (res.ok) {
      hidePinScreen();
    } else {
      // Wrong PIN — shake and clear
      document.querySelectorAll('.pin-dot.filled').forEach(d => d.classList.add('wrong'));
      setTimeout(() => { pinEntry = ''; renderPinDots(); }, 500);
    }
  } catch {
    pinEntry = '';
    renderPinDots();
  }
}

function onPinDigit(digit) {
  if (pinEntry.length >= pinLength) return;
  pinEntry += digit;
  renderPinDots();
  if (pinEntry.length >= pinLength) {
    // Small delay so the last dot fills visually before verification
    setTimeout(() => verifyPin(), 150);
  }
}

function onPinBackspace() {
  if (pinEntry.length > 0) {
    pinEntry = pinEntry.slice(0, -1);
    renderPinDots();
  }
}

// Idle timeout
function startIdleTimer() {
  stopIdleTimer();
  if (!pinEnabled || pinIdleTimeout <= 0) return;
  const ms = pinIdleTimeout * 60 * 1000;
  idleTimer = setTimeout(() => {
    if (pinEnabled && !pinLocked) showPinScreen();
  }, ms);
}

function stopIdleTimer() {
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
}

function resetIdleTimer() {
  if (pinEnabled && !pinLocked && pinIdleTimeout > 0) {
    startIdleTimer();
  }
}

// Bind PIN pad events
document.getElementById('pinPad').addEventListener('click', (e) => {
  const key = e.target.closest('.pin-key');
  if (!key) return;
  if (key.id === 'pinBackspace') return onPinBackspace();
  const digit = key.dataset.digit;
  if (digit !== undefined) onPinDigit(digit);
});

// Reset idle timer on any touch/mouse activity
['touchstart', 'pointerdown', 'keydown'].forEach(evt => {
  document.addEventListener(evt, resetIdleTimer, { passive: true });
});

/* ─── State ────────────────────────────────────────────────── */
let fixtures = [], groups = [], moverPresets = [], scenes = [], touchActions = [], effects = [];
let selectedColor = null, colorIntensity = 255, selectedGroups = new Set();
let outputEnabled = false, blackoutActive = false;
let strobeActive = false, smokeActive = false, hazeActive = false;
let fixtureEnabled = {}, fixtureDimmer = {}, groupDimmer = {};
let masterDimValue = 255;
let lastRgbOnlyValues = {}; // fixtureId → { chAddr: baseVal, ... } for RGB-only fixtures
let holdMode = true;
let activeSceneId = null;
let actionActiveStates = {}; // track toggle state per action button
let activeEffectSlots = {}; // track running effect per slot
let ws = null;

const COLORS = [
  { name:'Red',     hex:'#ff3b30', r:255, g:0,   b:0   },
  { name:'Green',   hex:'#30d158', r:0,   g:255, b:0   },
  { name:'Blue',    hex:'#0a84ff', r:0,   g:0,   b:255 },
  { name:'White',   hex:'#ffffff', r:255, g:255, b:255 },
  { name:'Amber',   hex:'#ff9f0a', r:255, g:160, b:0   },
  { name:'UV',      hex:'#bf5af2', r:120, g:0,   b:255 },
  { name:'Yellow',  hex:'#ffd60a', r:255, g:235, b:0   },
  { name:'Magenta', hex:'#ff375f', r:255, g:0,   b:150 },
  { name:'Cyan',    hex:'#64d2ff', r:0,   g:220, b:255 },
  { name:'Pink',    hex:'#ff6482', r:255, g:120, b:180 },
  { name:'Lime',    hex:'#a8ff00', r:180, g:255, b:0   },
  { name:'Orange',  hex:'#ff6723', r:255, g:100, b:0   },
];

/* ─── Init ─────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', async () => {
  // Check PIN before initialising the app
  await checkPinStatus();

  initTabs();
  initModeSwitch();
  initSliderBindings();
  initFxButtons();
  initActionCards();
  await Promise.all([fetchFixtures(), fetchGroups(), fetchMoverPresets(), fetchOutputState(), fetchTouchState(), fetchScenes(), fetchTouchActions(), fetchEffects()]);
  renderAll();
  renderActionsGrid();
  renderEffectsGrid();
  connectWebSocket();
});

/* ─── Tab Bar ──────────────────────────────────────────────── */
function initTabs() {
  document.querySelectorAll('.tab-bar button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.page, .page-dash, .page-actions').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('page-' + btn.dataset.page).classList.add('active');
    });
  });
}

/* ─── Mode Switch ──────────────────────────────────────────── */
function initModeSwitch() {
  const sw = document.getElementById('modeSwitch');
  sw.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      holdMode = btn.dataset.mode === 'hold';
      sw.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (holdMode) releaseAllActions();
      renderColors(); // rebind color hold/toggle events
    });
  });
}

/* ─── Slider bindings ──────────────────────────────────────── */
function initSliderBindings() {
  bindSlider('masterDim', 'masterDimVal', v => {
    sendMasterDimmer(v);
    fetch('/api/touch/master-dimmer', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ value: v })
    });
  });
  bindSlider('manualPan', 'panVal', sendManualPosition);
  bindSlider('manualTilt', 'tiltVal', sendManualPosition);
  bindSlider('manualSpeed', 'speedVal', sendManualPosition);
  // Effect speed slider (10-300 maps to 0.1x–3.0x)
  const esSlider = document.getElementById('effectSpeedSlider');
  const esVal = document.getElementById('effectSpeedVal');
  esSlider.addEventListener('input', () => {
    const v = (+esSlider.value / 100).toFixed(1);
    esVal.textContent = v + 'x';
    fetch('/api/touch/effect-speed', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ value: +v })
    });
  });
}

function bindSlider(sliderId, valId, onChange) {
  const el = document.getElementById(sliderId);
  const val = document.getElementById(valId);
  el.addEventListener('input', () => {
    val.textContent = el.value;
    if (onChange) onChange(+el.value);
  });
}

/* ─── FX Buttons ───────────────────────────────────────────── */
function initFxButtons() {
  document.getElementById('btnOutput').addEventListener('click', toggleOutput);
  document.getElementById('btnBlackout').addEventListener('click', doBlackout);
  document.getElementById('btnStopAllFx').addEventListener('click', () => {
    fetch('/api/effects/stop', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    document.querySelectorAll('.effect-tile.active').forEach(el => el.classList.remove('active'));
    activeEffectSlots = {};
  });
}

/* ─── Action Cards ─────────────────────────────────────────── */
function initActionCards() {
  document.querySelectorAll('.action-card[data-action]').forEach(card => {
    const action = card.dataset.action;
    const onFn = () => { runAction(action, true); card.classList.add('active'); };
    const offFn = () => { runAction(action, false); card.classList.remove('active'); };
    bindHoldToggle(card, onFn, offFn);
  });
}

/* ─── Universal Hold / Toggle Binder ──────────────────────── */
function bindHoldToggle(el, onFn, offFn) {
  let isOn = false, touchActive = false;

  function activate(e) {
    if (e) e.preventDefault();
    if (holdMode) { if (!isOn) { isOn = true; onFn(); } }
    else { if (isOn) { isOn = false; offFn(); } else { isOn = true; onFn(); } }
  }
  function deactivate(e) {
    if (e) e.preventDefault();
    if (holdMode && isOn) { isOn = false; offFn(); }
  }

  el.addEventListener('touchstart', e => { touchActive = true; activate(e); }, { passive: false });
  el.addEventListener('touchend', e => { touchActive = false; deactivate(e); }, { passive: false });
  el.addEventListener('touchcancel', e => { touchActive = false; deactivate(e); }, { passive: false });
  el.addEventListener('mousedown', e => { if (!touchActive) activate(e); });
  el.addEventListener('mouseup', e => { if (!touchActive) deactivate(e); });
  el.addEventListener('mouseleave', () => { if (!touchActive && holdMode && isOn) { isOn = false; offFn(); } });

  el._holdReset = () => { if (isOn) { isOn = false; offFn(); } };
}

function releaseAllActions() {
  document.querySelectorAll('.action-tile[data-action], #btnStrobe, #btnSmoke, #btnHaze').forEach(el => {
    if (el._holdReset) el._holdReset();
  });
}

/* ─── Data Fetch ───────────────────────────────────────────── */
async function fetchFixtures() {
  try {
    fixtures = await fetch('/api/fixture-channel-map').then(r => r.json());
    fixtures.forEach(f => {
      if (fixtureEnabled[f.id] === undefined) fixtureEnabled[f.id] = true;
      if (fixtureDimmer[f.id] === undefined) fixtureDimmer[f.id] = 255;
    });
  } catch (e) { console.error('fetch fixtures', e); }
}

async function fetchGroups() {
  try {
    groups = await fetch('/api/groups').then(r => r.json());
    groups.forEach(g => { if (groupDimmer[g.id] === undefined) groupDimmer[g.id] = 255; });
  } catch (e) { console.error('fetch groups', e); }
}

async function fetchMoverPresets() {
  try { moverPresets = await fetch('/api/mover-presets').then(r => r.json()); }
  catch (e) { console.error('fetch mover-presets', e); }
}

async function fetchOutputState() {
  try {
    const s = await fetch('/api/dmx/output').then(r => r.json());
    outputEnabled = s.enabled;
  } catch (e) {}
}

async function fetchTouchState() {
  try {
    const s = await fetch('/api/touch/state').then(r => r.json());
    if (s.disabledFixtures) s.disabledFixtures.forEach(id => { fixtureEnabled[id] = false; });
    blackoutActive = !!s.blackoutHold;
    if (s.masterDimmer !== undefined) {
      masterDimValue = s.masterDimmer;
      document.getElementById('masterDim').value = s.masterDimmer;
      document.getElementById('masterDimVal').textContent = s.masterDimmer;
    }
    if (s.effectSpeed !== undefined) {
      const pct = Math.round(s.effectSpeed * 100);
      document.getElementById('effectSpeedSlider').value = pct;
      document.getElementById('effectSpeedVal').textContent = s.effectSpeed.toFixed(1) + 'x';
    }
  } catch (e) {}
}

/* ─── WebSocket ────────────────────────────────────────────── */
let _wsBackoff = 1000;
const WS_BACKOFF_MAX = 15000;
function connectWebSocket() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host);
  ws.onopen = () => { _wsBackoff = 1000; updateStatus(true); };
  ws.onclose = () => { updateStatus(false); setTimeout(connectWebSocket, _wsBackoff); _wsBackoff = Math.min(_wsBackoff * 2, WS_BACKOFF_MAX); };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'dmxOutput') { outputEnabled = msg.enabled; renderOutputBtn(); }
      else if (msg.type === 'touchBlackoutHold') {
        blackoutActive = msg.active;
        document.getElementById('btnBlackout').classList.toggle('active', blackoutActive);
      }
      else if (msg.type === 'touchFixtureDisable') {
        fixtureEnabled[msg.fixtureId] = !msg.disabled;
        const tog = document.querySelector('.ios-toggle[data-id="' + msg.fixtureId + '"]');
        if (tog) tog.classList.toggle('on', !msg.disabled);
      }
      else if (msg.type === 'state' && msg.state && msg.state.decks) {
        updateDeckStrip(msg.state.decks);
      }
      else if (msg.type === 'scene_activated') {
        activeSceneId = msg.scene ? msg.scene.id : null;
        renderScenes();
      }
      else if (msg.type === 'scene_deactivated') {
        activeSceneId = null;
        renderScenes();
      }
    } catch (err) {}
  };
}

function updateStatus(connected) {
  document.getElementById('statusPip').className = 'status-pip ' + (connected ? 'ok' : 'err');
  renderOutputBtn();
}

/* ─── Deck Info Strip ──────────────────────────────────────── */
function updateDeckStrip(decks) {
  for (let d = 1; d <= 2; d++) {
    const dk = decks[d];
    const dot = document.getElementById('deckDot' + d);
    const track = document.getElementById('deckTrack' + d);
    const meta = document.getElementById('deckMeta' + d);
    if (!dk) continue;

    const isPlaying = dk.play > 0;
    const hasTrack = !!dk.filename;
    const isPaused = hasTrack && !isPlaying;

    dot.className = 'deck-play-dot' + (isPlaying ? ' playing' : (isPaused ? ' paused' : ''));

    if (dk.filename) {
      track.textContent = dk.filename;
      track.classList.remove('empty');
    } else {
      track.textContent = 'No track';
      track.classList.add('empty');
    }

    const bpm = dk.bpm > 0 ? dk.bpm.toFixed(1) + ' BPM' : '--- BPM';
    const rawTime = dk.time || 0;
    const secs = Math.floor(rawTime > 86400 ? rawTime / 1000 : rawTime);
    const time = String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0');
    meta.textContent = bpm + '  ·  ' + time;
  }
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════ */
function renderAll() {
  renderGroupDimmers();
  renderFixtureList();
  renderMoverPresets();
  renderScenes();
  renderOutputBtn();
  renderBlackoutBtn();
}

/* ─── Output / Blackout buttons ────────────────────────────── */
function renderOutputBtn() {
  const btn = document.getElementById('btnOutput');
  btn.textContent = outputEnabled ? 'OUTPUT' : 'OFF';
  btn.classList.toggle('off', !outputEnabled);
}

function renderBlackoutBtn() {
  document.getElementById('btnBlackout').classList.toggle('active', blackoutActive);
}

/* ─── Colors ───────────────────────────────────────────────── */
function renderColors() {
  const grid = document.getElementById('colorGrid');
  // Color tiles
  let html = COLORS.map((c, i) => {
    const dark = (c.r + c.g + c.b) > 600;
    return '<div class="color-tile' + (selectedColor === i ? ' active' : '') +
      '" style="background:' + c.hex + '" data-idx="' + i + '">' +
      '<span class="color-label" style="' + (dark ? 'color:#000;text-shadow:none;background:linear-gradient(transparent,rgba(255,255,255,.3))' : '') + '">' + c.name + '</span></div>';
  }).join('');

  // Action tiles (same style as colors)
  const actions = [
    { action:'fullWhite', icon:'&#9728;&#xFE0E;', label:'Full White' },
    { action:'fullColor', icon:'&#127912;', label:'Full Color' },
    { action:'dimWarm',   icon:'&#127774;', label:'Dim Warm' },
    { action:'allOff',    icon:'&#9679;', label:'All Off' },
    { action:'strobe',    icon:'&#9889;', label:'Strobe' },
    { action:'uvMode',    icon:'&#128302;', label:'UV Mode' },
  ];
  html += actions.map(a =>
    '<div class="color-tile action-tile" data-action="' + a.action + '">' +
    '<span class="tile-icon">' + a.icon + '</span>' +
    '<span class="color-label">' + a.label + '</span></div>'
  ).join('');

  // Mover preset tiles
  html += moverPresets.map((p, i) =>
    '<div class="color-tile mover-tile" data-mover="' + i + '">' +
    '<span class="color-label">' + esc(p.name) + '</span></div>'
  ).join('');

  grid.innerHTML = html;

  // Bind color tiles
  grid.querySelectorAll('.color-tile:not(.action-tile):not(.mover-tile)').forEach(el => {
    const idx = +el.dataset.idx;
    if (holdMode) {
      let t = false;
      el.addEventListener('touchstart', e => { e.preventDefault(); t = true; selectedColor = idx; renderColorActive(); sendColorOverride(); }, { passive: false });
      el.addEventListener('touchend', e => { e.preventDefault(); t = false; clearColorOverrideDMX(); selectedColor = null; renderColorActive(); }, { passive: false });
      el.addEventListener('touchcancel', e => { e.preventDefault(); t = false; clearColorOverrideDMX(); selectedColor = null; renderColorActive(); }, { passive: false });
      el.addEventListener('mousedown', () => { if (!t) { selectedColor = idx; renderColorActive(); sendColorOverride(); } });
      el.addEventListener('mouseup', () => { if (!t) { clearColorOverrideDMX(); selectedColor = null; renderColorActive(); } });
      el.addEventListener('mouseleave', () => { if (!t && selectedColor === idx) { clearColorOverrideDMX(); selectedColor = null; renderColorActive(); } });
    } else {
      el.addEventListener('click', () => {
        selectedColor = selectedColor === idx ? null : idx;
        renderColorActive();
        if (selectedColor !== null) sendColorOverride();
      });
    }
  });

  // Bind action tiles
  grid.querySelectorAll('.action-tile[data-action]').forEach(card => {
    const action = card.dataset.action;
    const onFn = () => runAction(action, true);
    const offFn = () => runAction(action, false);
    bindHoldToggle(card, onFn, offFn);
  });

  // Bind mover tiles
  grid.querySelectorAll('.mover-tile[data-mover]').forEach(el => {
    el.addEventListener('click', () => sendMoverPreset(moverPresets[+el.dataset.mover]));
  });
}

function renderColorActive() {
  document.querySelectorAll('.color-tile').forEach(el => {
    el.classList.toggle('active', +el.dataset.idx === selectedColor);
  });
}

/* ─── Target Groups ────────────────────────────────────────── */
function renderColorTargetGroups() {
  const wrap = document.getElementById('colorTargetGroups');

  pan_sweep:'motion',tilt_sweep:'motion',circle:'motion',figure_eight:'motion',random_move:'motion',fan:'motion',nod:'motion',
  chase:'multicell',comet:'multicell',scanner:'multicell',buildup:'multicell',segments:'multicell',ripple:'multicell',cell_strobe:'multicell',gradient:'multicell',
  rig_chase:'rig',rig_color_wave:'rig',rig_sweep:'rig',rig_alternate:'rig',rig_converge:'rig',rig_rainbow:'rig',
  sound_pulse:'sound',sound_strobe:'sound',sound_chase:'sound',sound_wave:'sound',sound_flash:'sound',sound_vu:'sound',
};
const EFFECT_CATEGORY_MAP = {
  pulse:'color',rainbow:'color',strobe:'color',color_fade:'color',sparkle:'color',color_wave:'color',fire:'color',
  pan_sweep:'motion',tilt_sweep:'motion',circle:'motion',figure_eight:'motion',random_move:'motion',fan:'motion',nod:'motion',
  chase:'multicell',comet:'multicell',scanner:'multicell',buildup:'multicell',segments:'multicell',ripple:'multicell',cell_strobe:'multicell',gradient:'multicell',
  rig_chase:'rig',rig_color_wave:'rig',rig_sweep:'rig',rig_alternate:'rig',rig_converge:'rig',rig_rainbow:'rig',
  sound_pulse:'sound',sound_strobe:'sound',sound_chase:'sound',sound_wave:'sound',sound_flash:'sound',sound_vu:'sound',
};
const EFFECT_CATEGORY_COLORS = {
  color:  { bg:'rgba(10,132,255,.2)', border:'rgba(10,132,255,.5)' },
  rig:    { bg:'rgba(48,209,88,.2)',  border:'rgba(48,209,88,.5)' },
  motion: { bg:'rgba(255,159,10,.2)', border:'rgba(255,159,10,.5)' },
  multicell:{ bg:'rgba(191,90,242,.2)', border:'rgba(191,90,242,.5)' },
  sound:  { bg:'rgba(255,59,48,.2)',  border:'rgba(255,59,48,.5)' },
};

async function fetchEffects() {
  try { effects = await fetch('/api/effects').then(r => r.json()); }
  catch (e) { console.error('fetch effects', e); }
}

function getEffectSlotClient(type) {
  return EFFECT_SLOT_MAP[type] || 'color';
}

function renderEffectsGrid() {
  const categories = { color:[], rig:[], motion:[], multicell:[], sound:[] };
  for (const fx of effects) {
    const cat = EFFECT_CATEGORY_MAP[fx.type] || 'color';
    categories[cat].push(fx);
  }

  const grids = {
    color: document.getElementById('effectGridColor'),
    rig: document.getElementById('effectGridRig'),
    motion: document.getElementById('effectGridMotion'),
    multicell: document.getElementById('effectGridMulticell'),
    sound: document.getElementById('effectGridSound'),
  };

  for (const [cat, list] of Object.entries(categories)) {
    const grid = grids[cat];
    if (!grid) continue;
    const colors = EFFECT_CATEGORY_COLORS[cat];
    if (!list.length) {
      grid.innerHTML = '<div style="color:var(--dim);font-size:12px;padding:4px 0">None</div>';
      grid.previousElementSibling.style.display = 'none';
      grid.style.display = 'none';
      continue;
    }
    grid.previousElementSibling.style.display = '';
    grid.style.display = '';
    grid.innerHTML = list.map(fx => {
      const isActive = activeEffectSlots[getEffectSlotClient(fx.type)] === fx.id;
      return '<div class="color-tile effect-tile' + (isActive ? ' active' : '') + '" data-eid="' + fx.id + '" data-type="' + fx.type + '" style="background:' + colors.bg + ';border-color:' + (isActive ? '#fff' : colors.border) + '">' +
        '<span class="color-label" style="background:none;position:static;font-size:11px;font-weight:700">' + esc(fx.name) + '</span></div>';
    }).join('');

    grid.querySelectorAll('.effect-tile').forEach(el => {
      el.addEventListener('click', () => toggleEffect(+el.dataset.eid, el.dataset.type));
    });
  }
}

function toggleEffect(effectId, effectType) {
  const slot = getEffectSlotClient(effectType);
  if (activeEffectSlots[slot] === effectId) {
    // Stop this slot
    fetch('/api/effects/stop', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ slot })
    });
    delete activeEffectSlots[slot];
  } else {
    // Run this effect on all enabled fixtures
    const fixtureIds = getEnabledFixtures().map(f => f.id);
    fetch('/api/effects/run', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ effectId, fixtureIds })
    });
    activeEffectSlots[slot] = effectId;
  }
  renderEffectsGrid();
}

/* ═══════════════════════════════════════════════════════════════
   DMX HELPERS
   ═══════════════════════════════════════════════════════════════ */
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function getTargetFixtures() {
  if (selectedGroups.size === 0) return fixtures;
  return fixtures.filter(f => f.group_ids && f.group_ids.some(gid => selectedGroups.has(gid)));
}

function getEnabledFixtures(list) {
  return (list || fixtures).filter(f => fixtureEnabled[f.id] !== false);
}

function buildChannelUpdates(targetFixtures, channelFilter, valueFn) {
  const byUniverse = {};
  for (const f of targetFixtures) {
    if (fixtureEnabled[f.id] === false) continue;
    const u = f.universe || 1;
    if (!byUniverse[u]) byUniverse[u] = [];
    const hasDimmer = f.channels.some(c => c.type === 'dimmer');
    for (const ch of f.channels) {
      if (channelFilter(ch, f)) {
        let val = valueFn(ch, f);
        if (['red','green','blue','white','amber','uv','dimmer'].includes(ch.type)) {
          const fDim = fixtureDimmer[f.id] !== undefined ? fixtureDimmer[f.id] : 255;
          val = Math.round(val * (fDim / 255));
          // For RGB-only fixtures, record base value and scale by master dimmer
          if (!hasDimmer && ch.type !== 'dimmer') {
            if (!lastRgbOnlyValues[f.id]) lastRgbOnlyValues[f.id] = {};
            lastRgbOnlyValues[f.id][ch.dmx_address] = val; // base value before master dim
            val = Math.round(val * (masterDimValue / 255));
          }
        }
        byUniverse[u].push({ ch: ch.dmx_address, val: Math.max(0, Math.min(255, val)) });
      }
    }
  }
  return byUniverse;
}

function sendDMX(byUniverse) {
  for (const [universe, channels] of Object.entries(byUniverse)) {
    if (channels.length) {
      fetch('/api/dmx/channels', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ universe: +universe, channels })
      });
    }
  }
}

/* ─── Override Notification ────────────────────────────── */
function notifyOverride(type, fixtureIds, active) {
  if (!fixtureIds || !fixtureIds.length) return;
  fetch('/api/touch/' + type + '-override', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fixtureIds, active })
  }).catch(() => {});
}

function getFixtureIdsFromTargets(targets) {
  return targets.filter(f => fixtureEnabled[f.id] !== false).map(f => f.id);
}

/* ─── Color Wheel Helper ───────────────────────────────────── */
function findNearestWheelDmx(fixture, r, g, b) {
  const map = fixture.color_wheel_map;
  if (!map || !map.length) return null;
  let best = null, bestDist = Infinity;
  for (const entry of map) {
    const hex = entry.color_hex;
    const cr = parseInt(hex.slice(1,3), 16);
    const cg = parseInt(hex.slice(3,5), 16);
    const cb = parseInt(hex.slice(5,7), 16);
    const dist = (cr-r)*(cr-r) + (cg-g)*(cg-g) + (cb-b)*(cb-b);
    if (dist < bestDist) { bestDist = dist; best = entry; }
  }
  return best ? best.dmx_start : null;
}

/* ─── Color Override ───────────────────────────────────────── */
function sendColorOverride() {
  if (selectedColor === null) return;
  const c = COLORS[selectedColor];
  const scale = colorIntensity / 255;
  const targets = getTargetFixtures();
  const updates = buildChannelUpdates(targets,
    ch => ['red','green','blue','white','amber','uv','dimmer','color_wheel'].includes(ch.type),
    (ch, f) => {
      switch (ch.type) {
        case 'red': return Math.round(c.r * scale);
        case 'green': return Math.round(c.g * scale);
        case 'blue': return Math.round(c.b * scale);
        case 'white': return (c.r === 255 && c.g === 255 && c.b === 255) ? Math.round(255 * scale) : 0;
        case 'dimmer': return Math.round(255 * scale);
        case 'amber': return c.name === 'Amber' ? Math.round(255 * scale) : 0;
        case 'uv': return c.name === 'UV' ? Math.round(255 * scale) : 0;
        case 'color_wheel': {
          const dmx = findNearestWheelDmx(f, c.r, c.g, c.b);
          return dmx !== null ? dmx : 0;
        }
        default: return 0;
      }
    });
  sendDMX(updates);
  notifyOverride('color', getFixtureIdsFromTargets(targets), true);
}

function clearColorOverrideDMX() {
  const targets = getTargetFixtures();
  const updates = buildChannelUpdates(targets,
    ch => ['red','green','blue','white','amber','uv','dimmer'].includes(ch.type), () => 0);
  sendDMX(updates);
  notifyOverride('color', getFixtureIdsFromTargets(targets), false);
}

function clearColorOverride() { clearColorOverrideDMX(); selectedColor = null; renderColorActive(); }

/* ─── Strobe ───────────────────────────────────────────────── */
function strobeOn() {
  if (strobeActive) return;
  strobeActive = true;
  document.getElementById('btnStrobe').classList.add('strobe-on');
  const speed = +document.getElementById('strobeSpeed').value || 200;
  const updates = buildChannelUpdates(getEnabledFixtures(),
    ch => ch.type === 'strobe' || (ch.ranges && ch.ranges.some(r => r.type === 'strobe')),
    ch => {
      if (ch.type === 'strobe') return speed;
      const range = ch.ranges.find(r => r.type === 'strobe');
      return range ? Math.round(range.min + (speed / 255) * (range.max - range.min)) : speed;
    });
  sendDMX(updates);
}

function strobeOff() {
  if (!strobeActive) return;
  strobeActive = false;
  document.getElementById('btnStrobe').classList.remove('strobe-on');
  const updates = buildChannelUpdates(getEnabledFixtures(),
    ch => ch.type === 'strobe' || (ch.ranges && ch.ranges.some(r => r.type === 'strobe')), () => 0);
  sendDMX(updates);
}

/* ─── Smoke / Haze ─────────────────────────────────────────── */
function setSmokeHaze(type, on) {
  if (type === 'smoke') { smokeActive = on; document.getElementById('btnSmoke').classList.toggle('active', on); }
  if (type === 'haze') { hazeActive = on; document.getElementById('btnHaze').classList.toggle('active', on); }
  const updates = buildChannelUpdates(getEnabledFixtures(),
    ch => ch.type === type || ch.type === 'fog' || ch.type === 'smoke' || ch.type === 'haze',
    () => on ? 255 : 0);
  sendDMX(updates);
}

/* ─── Master Dimmer ────────────────────────────────────────── */
function sendMasterDimmer(val) {
  const v = +val;
  masterDimValue = v;
  const byUniverse = {};
  for (const f of getEnabledFixtures()) {
    const u = f.universe || 1;
    if (!byUniverse[u]) byUniverse[u] = [];
    const hasDimmer = f.channels.some(ch => ch.type === 'dimmer');
    if (hasDimmer) {
      // Fixture with hardware dimmer: scale dimmer channel
      const fDim = fixtureDimmer[f.id] !== undefined ? fixtureDimmer[f.id] : 255;
      for (const ch of f.channels) {
        if (ch.type === 'dimmer') {
          byUniverse[u].push({ ch: ch.dmx_address, val: Math.round(v * (fDim / 255)) });
        }
      }
    } else if (lastRgbOnlyValues[f.id]) {
      // RGB-only fixture: re-send last known colour values scaled by new master
      for (const [addr, baseVal] of Object.entries(lastRgbOnlyValues[f.id])) {
        byUniverse[u].push({ ch: +addr, val: Math.max(0, Math.min(255, Math.round(baseVal * (v / 255)))) });
      }
    }
  }
  sendDMX(byUniverse);
}

/* ─── Group Dimmers ────────────────────────────────────────── */
function onGroupDimmer(groupId, val) {
  const grp = groups.find(g => g.id === groupId);
  if (!grp) return;
  const grpFixtures = fixtures.filter(f => (f.group_ids || []).includes(groupId));
  const updates = buildChannelUpdates(grpFixtures, ch => ch.type === 'dimmer', () => val);
  sendDMX(updates);
}

/* ─── Fixture Dimmers & Disable ────────────────────────────── */
function onFixtureDimmer(fixId, val) {
  const f = fixtures.find(fx => fx.id === fixId);
  if (!f || fixtureEnabled[fixId] === false) return;
  const u = f.universe || 1;
  const channels = [];
  for (const ch of f.channels) { if (ch.type === 'dimmer') channels.push({ ch: ch.dmx_address, val }); }
  if (channels.length) sendDMX({ [u]: channels });
}

function blackoutFixture(fixId) {
  const f = fixtures.find(fx => fx.id === fixId);
  if (!f) return;
  sendDMX({ [f.universe || 1]: f.channels.map(ch => ({ ch: ch.dmx_address, val: 0 })) });
}

/* ─── Mover Presets & Manual Position ──────────────────────── */
function sendMoverPreset(preset) {
  if (!preset.positions) return;
  const byUniverse = {};
  const affectedIds = [];
  for (const pos of preset.positions) {
    const f = fixtures.find(fx => fx.id === pos.fixture_id);
    if (!f || fixtureEnabled[f.id] === false) continue;
    affectedIds.push(f.id);
    const u = f.universe || 1;
    if (!byUniverse[u]) byUniverse[u] = [];
    for (const ch of f.channels) {
      if (ch.type === 'pan' && pos.pan !== undefined) byUniverse[u].push({ ch: ch.dmx_address, val: pos.pan });
      if (ch.type === 'tilt' && pos.tilt !== undefined) byUniverse[u].push({ ch: ch.dmx_address, val: pos.tilt });
    }
  }
  sendDMX(byUniverse);
  notifyOverride('movement', affectedIds, true);
}

function clearMovementOverride() {
  const movers = getEnabledFixtures().filter(f =>
    f.channels.some(ch => ch.type === 'pan') && f.channels.some(ch => ch.type === 'tilt'));
  notifyOverride('movement', movers.map(f => f.id), false);
}

function sendManualPosition() {
  const pan = +document.getElementById('manualPan').value;
  const tilt = +document.getElementById('manualTilt').value;
  const speed = +document.getElementById('manualSpeed').value;
  const movers = getEnabledFixtures().filter(f =>
    f.channels.some(ch => ch.type === 'pan') && f.channels.some(ch => ch.type === 'tilt'));
  const updates = buildChannelUpdates(movers,
    ch => ch.type === 'pan' || ch.type === 'tilt' || ch.type === 'speed',
    ch => ch.type === 'pan' ? pan : ch.type === 'tilt' ? tilt : speed);
  sendDMX(updates);
  notifyOverride('movement', movers.map(f => f.id), true);
}

/* ─── Quick Actions ────────────────────────────────────────── */
function runAction(action, on) {
  const map = {
    fullWhite: { on: actionFullWhite, off: actionAllOff },
    fullColor: { on: actionFullColor, off: actionAllOff },
    dimWarm:   { on: actionDimWarm,   off: actionAllOff },
    allOff:    { on: actionAllOff,    off: () => {} },
    strobe:    { on: strobeOn,        off: strobeOff },
    uvMode:    { on: actionUVMode,    off: actionAllOff },
  };
  const e = map[action]; if (!e) return;
  if (on) e.on(); else e.off();
}

function actionFullWhite() {
  const targets = getEnabledFixtures();
  sendDMX(buildChannelUpdates(targets,
    ch => ['red','green','blue','white','dimmer','color_wheel'].includes(ch.type),
    (ch, f) => {
      if (ch.type === 'color_wheel') { const d = findNearestWheelDmx(f, 255, 255, 255); return d !== null ? d : 0; }
      return 255;
    }));
  notifyOverride('color', getFixtureIdsFromTargets(targets), true);
}

function actionFullColor() {
  if (selectedColor === null) { selectedColor = 0; renderColorActive(); }
  sendColorOverride();
}

function actionDimWarm() {
  const targets = getEnabledFixtures();
  sendDMX(buildChannelUpdates(targets,
    ch => ['red','green','blue','white','amber','dimmer','color_wheel'].includes(ch.type),
    (ch, f) => {
      switch (ch.type) {
        case 'red': return 180; case 'green': return 100; case 'blue': return 40;
        case 'amber': return 200; case 'white': return 80; case 'dimmer': return 120;
        case 'color_wheel': { const d = findNearestWheelDmx(f, 180, 100, 40); return d !== null ? d : 0; }
        default: return 0;
      }
    }));
  notifyOverride('color', getFixtureIdsFromTargets(targets), true);
}

function actionAllOff() {
  const byUniverse = {};
  for (const f of fixtures) {
    const u = f.universe || 1;
    if (!byUniverse[u]) byUniverse[u] = [];
    for (const ch of f.channels) byUniverse[u].push({ ch: ch.dmx_address, val: 0 });
  }
  sendDMX(byUniverse);
  notifyOverride('color', fixtures.map(f => f.id), false);
  notifyOverride('movement', fixtures.map(f => f.id), false);
}

function actionUVMode() {
  const targets = getEnabledFixtures();
  sendDMX(buildChannelUpdates(targets,
    ch => ['red','green','blue','white','uv','dimmer','color_wheel'].includes(ch.type),
    (ch, f) => {
      switch (ch.type) {
        case 'uv': return 255; case 'dimmer': return 200; case 'blue': return 40;
        case 'color_wheel': { const d = findNearestWheelDmx(f, 0, 0, 40); return d !== null ? d : 0; }
        default: return 0;
      }
    }));
  notifyOverride('color', getFixtureIdsFromTargets(targets), true);
}

/* ═══════════════════════════════════════════════════════════════
   SCENES
   ═══════════════════════════════════════════════════════════════ */
async function fetchScenes() {
  try {
    const [sceneList, activeRes] = await Promise.all([
      fetch('/api/scenes').then(r => r.json()),
      fetch('/api/scenes/active').then(r => r.json()),
    ]);
    scenes = sceneList;
    activeSceneId = activeRes.activeSceneId;
  } catch (e) { console.error('fetch scenes', e); }
}

function renderScenes() {
  const wrap = document.getElementById('scenesList');
  const status = document.getElementById('sceneActiveStatus');

  // Active status badge + deactivate button
  if (activeSceneId) {
    const active = scenes.find(s => s.id === activeSceneId);
    status.innerHTML =
      '<div class="scene-active-badge"><span class="badge-dot"></span>Active: ' + esc(active ? active.name : 'Scene #' + activeSceneId) + '</div>' +
      '<button class="scene-deactivate-btn" onclick="deactivateScene()">Deactivate Scene</button>';
  } else {
    status.innerHTML = '';
  }

  if (!scenes.length) {
    wrap.innerHTML = '<div class="scene-empty">No scenes configured.<br>Use the main UI to create scenes.</div>';
    return;
  }

  wrap.innerHTML = scenes.map(s => {
    const isActive = s.id === activeSceneId;
    // Build color preview dots from entries
    let dots = '';
    if (s.entries && s.entries.length) {
      dots = s.entries.slice(0, 8).map(e => {
        let cv;
        try { cv = typeof e.channel_values === 'string' ? JSON.parse(e.channel_values) : e.channel_values; } catch(_) { cv = {}; }
        const r = cv.red || 0, g = cv.green || 0, b = cv.blue || 0;
        return '<span class="scene-entry-dot" style="background:rgb(' + r + ',' + g + ',' + b + ')"></span>';
      }).join('');
      if (s.entries.length > 8) dots += '<span style="color:var(--dim);font-size:11px;align-self:center">+' + (s.entries.length - 8) + '</span>';
    }
    return '<div class="scene-card' + (isActive ? ' active-scene' : '') + '" data-sid="' + s.id + '">' +
      '<div class="sc-name">' + esc(s.name) + (s.is_default ? ' &#9733;' : '') + '</div>' +
      (s.description ? '<div class="sc-desc">' + esc(s.description) + '</div>' : '') +
      '<div class="sc-entries">' + dots + '</div>' +
    '</div>';
  }).join('');

  // Bind tap to activate
  wrap.querySelectorAll('.scene-card').forEach(el => {
    el.addEventListener('click', () => {
      const sid = +el.dataset.sid;
      if (sid === activeSceneId) return; // already active
      activateScene(sid);
    });
  });
}

async function activateScene(id) {
  try {
    await fetch('/api/scenes/' + id + '/activate', { method: 'POST' });
    activeSceneId = id;
    renderScenes();
  } catch (e) { console.error('activate scene', e); }
}

async function deactivateScene() {
  try {
    await fetch('/api/scenes/deactivate', { method: 'POST' });
    activeSceneId = null;
    renderScenes();
  } catch (e) { console.error('deactivate scene', e); }
}

/* ═══════════════════════════════════════════════════════════════
   ACTIONS GRID — configurable full-screen action board
   ═══════════════════════════════════════════════════════════════ */
async function fetchTouchActions() {
  try {
    touchActions = await fetch('/api/touch-actions').then(r => r.json());
  } catch (e) { console.error('fetch touch-actions', e); }
}

function renderActionsGrid() {
  const grid = document.getElementById('actionsGrid');
  const enabled = touchActions.filter(a => a.enabled);

  if (!enabled.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;color:var(--dim);font-size:14px;text-align:center;align-self:center;padding:40px 0">No action buttons configured.<br>Use Config &rarr; Touch Actions in the main UI.</div>';
    return;
  }

  // Determine column count from data (max grid_col + grid_w)
  let maxCol = 4;
  for (const a of enabled) {
    const endCol = (a.grid_col || 0) + (a.grid_w || 1);
    if (endCol > maxCol) maxCol = endCol;
  }
  grid.style.setProperty('--ag-cols', maxCol);

  grid.innerHTML = enabled.map(a => {
    const style = 'background:' + (a.color || '#333') + ';color:' + (a.text_color || '#fff') +
      ';grid-column:' + ((a.grid_col || 0) + 1) + ' / span ' + (a.grid_w || 1) +
      ';grid-row:' + ((a.grid_row || 0) + 1) + ' / span ' + (a.grid_h || 1);
    const activeClass = actionActiveStates[a.id] ? ' action-active' : '';
    return '<button class="action-btn' + activeClass + '" data-aid="' + a.id + '" style="' + style + '">' +
      (a.icon ? '<span class="ab-icon">' + a.icon + '</span>' : '') +
      '<span class="ab-label">' + esc(a.label) + '</span></button>';
  }).join('');

  // Bind events
  grid.querySelectorAll('.action-btn').forEach(btn => {
    const aid = +btn.dataset.aid;
    const action = touchActions.find(a => a.id === aid);
    if (!action) return;

    const onFn = () => { executeAction(action, true); btn.classList.add('held'); };
    const offFn = () => { executeAction(action, false); btn.classList.remove('held'); };

    if (action.action_type === 'scene') {
      // Scenes are always toggle (activate/deactivate)
      btn.addEventListener('click', () => {
        if (actionActiveStates[aid]) {
          actionActiveStates[aid] = false;
          deactivateScene();
          btn.classList.remove('action-active');
        } else {
          // Deactivate other scene buttons
          for (const k of Object.keys(actionActiveStates)) {
            const ta = touchActions.find(t => t.id === +k);
            if (ta && ta.action_type === 'scene') actionActiveStates[k] = false;
          }
          actionActiveStates[aid] = true;
          const sid = action.action_data.scene_id;
          if (sid) activateScene(sid);
          renderActionsGrid();
        }
      });
    } else {
      bindHoldToggle(btn, onFn, offFn);
    }
  });
}

function executeAction(action, on) {
  const data = action.action_data || {};
  switch (action.action_type) {
    case 'color': {
      if (on) {
        const scale = colorIntensity / 255;
        const r = Math.round((data.red || 0) * scale);
        const g = Math.round((data.green || 0) * scale);
        const b = Math.round((data.blue || 0) * scale);
        const updates = buildChannelUpdates(getEnabledFixtures(),
          ch => ['red','green','blue','white','amber','uv','dimmer','color_wheel'].includes(ch.type),
          (ch, f) => {
            switch (ch.type) {
              case 'red': return r;
              case 'green': return g;
              case 'blue': return b;
              case 'white': return data.white || 0;
              case 'dimmer': return Math.round(255 * scale);
              case 'amber': return data.amber || 0;
              case 'uv': return data.uv || 0;
              case 'color_wheel': { const d = findNearestWheelDmx(f, data.red || 0, data.green || 0, data.blue || 0); return d !== null ? d : 0; }
              default: return 0;
            }
          });
        sendDMX(updates);
      } else {
        clearColorOverrideDMX();
      }
      break;
    }
    case 'quick_action': {
      const qa = data.action;
      if (qa) runAction(qa, on);
      break;
    }
    case 'mover_preset': {
      if (on && data.preset_index !== undefined) {
        const preset = moverPresets[data.preset_index];
        if (preset) sendMoverPreset(preset);
      }
      break;
    }
    case 'scene': {
      // Handled inline in renderActionsGrid click handler
      break;
    }
    case 'strobe': {
      if (on) strobeOn(); else strobeOff();
      break;
    }
    case 'smoke': {
      setSmokeHaze('smoke', on);
      break;
    }
    case 'haze': {
      setSmokeHaze('haze', on);
      break;
    }
    case 'blackout': {
      if (on) { blackoutActive = true; doBlackout(); }
      break;
    }
    case 'master_dimmer': {
      if (on && data.value !== undefined) {
        document.getElementById('masterDim').value = data.value;
        document.getElementById('masterDimVal').textContent = data.value;
        sendMasterDimmer(data.value);
      }
      break;
    }
  }
}
</script>
