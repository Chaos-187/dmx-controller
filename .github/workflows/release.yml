# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions — DMX Controller Release
#
# Creates a GitHub release with a standalone Windows zip whenever a version
# tag is pushed.
#
# Release flow:
#   npm run release:prepare -- 1.3.0
#   git commit -am "Release v1.3.0" && git tag v1.3.0
#   git push origin main && git push origin v1.3.0
#
# See docs/RELEASE.md
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PACKAGE_NAME: dmx-controller

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          if ($pkg -ne $tag) {
            throw "package.json version ($pkg) does not match tag ($tag). Run: npm run release:prepare -- $tag"
          }
          Write-Host "Version OK: $pkg"

      - name: Install dependencies
        run: npm install

      - name: Build (pkg + native addons)
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Create release zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipFile = "${{ env.PACKAGE_NAME }}-${tag}.zip"
          if (-not (Test-Path dist/dmx-controller.exe)) {
            throw "dist/dmx-controller.exe not found — build failed"
          }
          Compress-Archive -Path dist\* -DestinationPath $zipFile -Force
          $sizeMb = [math]::Round((Get-Item $zipFile).Length / 1MB, 1)
          Write-Host "Created $zipFile ($sizeMb MB)"
          echo "ZIP_FILE=$zipFile" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after Inno Setup install" }
          & $iscc installer\thaluxis-dmx.iss "/DMyAppVersion=$version"
          $setupFile = "${{ env.PACKAGE_NAME }}-${version}-setup.exe"
          if (-not (Test-Path $setupFile)) { throw "Installer not created: $setupFile" }
          $sizeMb = [math]::Round((Get-Item $setupFile).Length / 1MB, 1)
          Write-Host "Created $setupFile ($sizeMb MB)"
          echo "SETUP_FILE=$setupFile" >> $env:GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            ${{ env.ZIP_FILE }}
            ${{ env.SETUP_FILE }}
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          BODY="Thaluxis DMX release **${TAG}**"
          if [ -n "$PREV" ]; then
            BODY="${BODY}"$'\n\n'"### Changes since ${PREV}"$'\n'
            BODY="${BODY}$(git log --pretty=format:'- %s (%h)' "${PREV}..${TAG}" | head -50)"
          fi
          BODY="${BODY}"$'\n\n'"### Install / update"$'\n'
          BODY="${BODY}Download **${{ env.PACKAGE_NAME }}-${TAG}-setup.exe** for a guided install, or **${{ env.PACKAGE_NAME }}-${TAG}.zip** to extract manually (keep the \`data/\` folder on upgrade). Running hubs can use **Config → About → Check for updates**."$'\n'
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Thaluxis DMX ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            ${{ env.PACKAGE_NAME }}-${{ github.ref_name }}.zip
            ${{ env.PACKAGE_NAME }}-*-setup.exe
          generate_release_notes: true
